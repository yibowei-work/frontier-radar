name: Refresh intelligence and publish

on:
  schedule:
    # 03:00 UTC = 11:00 Asia/Shanghai. GitHub may start scheduled jobs a few minutes late.
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: frontier-radar-production
  cancel-in-progress: false

jobs:
  prepare:
    name: Check and refresh data
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Test collection rules
        run: python3 -m unittest discover -s tests -v

      - name: Collect official-source intelligence
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/collect.py

      - name: Validate publishable data
        run: python3 scripts/validate_data.py

      - name: Persist refreshed data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "frontier-radar-bot"
          git config user.email "frontier-radar-bot@users.noreply.github.com"
          git add public/data/intelligence.json public/data/state.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: refresh intelligence $(date -u +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Record exact source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Build and deploy GitHub Pages
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out validated revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build static site
        run: |
          npx tsc --noEmit
          npm run build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist/client

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
